<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#skyGradient)" rx="20"/>

  <!-- Decorative circles -->
  <circle cx="350" cy="50" r="80" fill="#FFD700" opacity="0.1"/>
  <circle cx="350" cy="50" r="60" fill="#FFD700" opacity="0.15"/>

  <!-- Sun -->
  <g transform="translate(320, 60)">
    <circle r="35" fill="url(#sunGradient)" filter="url(#shadow)"/>
    <circle r="45" fill="#FFD700" opacity="0.2"/>
    <!-- Sun rays -->
    <g stroke="#FFD700" stroke-width="2" opacity="0.6">
      <line x1="0" y1="-50" x2="0" y2="-42"/>
      <line x1="0" y1="50" x2="0" y2="42"/>
      <line x1="-50" y1="0" x2="-42" y2="0"/>
      <line x1="50" y1="0" x2="42" y2="0"/>
      <line x1="-35" y1="-35" x2="-30" y2="-30"/>
      <line x1="35" y1="35" x2="30" y2="30"/>
      <line x1="-35" y1="35" x2="-30" y2="30"/>
      <line x1="35" y1="-35" x2="30" y2="-30"/>
    </g>
  </g>

  <!-- Clouds -->
  <g opacity="0.9">
    <path d="M 80 90 Q 95 75 115 85 Q 130 70 150 85 Q 165 80 170 95 Q 170 110 150 110 L 85 110 Q 65 110 65 95 Q 65 85 80 90" fill="white" filter="url(#shadow)"/>
    <path d="M 220 120 Q 235 105 255 115 Q 270 100 290 115 Q 305 110 310 125 Q 310 140 290 140 L 225 140 Q 205 140 205 125 Q 205 115 220 120" fill="white" filter="url(#shadow)"/>
  </g>

  <!-- Main Dashboard Card -->
  <rect x="40" y="150" width="320" height="130" fill="white" rx="20" filter="url(#shadow)"/>

  <!-- Temperature Section -->
  <text x="70" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#1E293B">24°</text>
  <text x="70" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#64748B">SENSACIÓN 26°</text>

  <!-- Weather Icon & Description -->
  <g transform="translate(200, 195)">
    <circle cx="0" cy="-5" r="12" fill="#FFD700"/>
    <path d="M -15 5 Q -15 -5 0 -5 Q 15 -5 15 5 Q 15 12 0 12 Q -15 12 -15 5" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  </g>
  <text x="245" y="200" font-family="system-ui, -apple-serif, sans-serif" font-size="13" font-weight="600" fill="#475569">Parcialmente</text>
  <text x="245" y="218" font-family="system-ui, -apple-serif, sans-serif" font-size="13" font-weight="600" fill="#475569">Nublado</text>

  <!-- Stats Row -->
  <g transform="translate(0, 250)">
    <rect x="55" y="0" width="85" height="20" rx="10" fill="#F1F5F9"/>
    <text x="97" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">💧 65%</text>

    <rect x="155" y="0" width="90" height="20" rx="10" fill="#F1F5F9"/>
    <text x="200" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">💨 12 km/h</text>

    <rect x="260" y="0" width="85" height="20" rx="10" fill="#F1F5F9"/>
    <text x="302" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">☀️ UV 5</text>
  </g>

  <!-- Location -->
  <text x="200" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">📍 Ciudad de México</text>
</svg>
